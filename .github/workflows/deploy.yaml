name: Build and Push Docker

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Клонування репозиторію
      - name: Checkout code
        uses: actions/checkout@v4

      # Логін у Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  # або DOCKER_PASSWORD, якщо використовуєш пароль

      # Build Docker image
      - name: Build Docker image
        run: docker build -t slavaqtx1488/docker123123123:latest .

      # Push Docker image
      - name: Push Docker image
        run: docker push slavaqtx1488/docker123123123:latest

      # Trigger Render Deploy (авто-деплой на Render)
      - name: Trigger Render Deploy
        if: success()  # тільки якщо попередні кроки пройшли без помилок
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"